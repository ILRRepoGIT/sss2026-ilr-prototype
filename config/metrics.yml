# ---------------------------------------------------------------------------
# Metric catalogue v2 - School Sport Survey 2026 ILR
#
# Every chart and data-led sentence traces back to an entry here.
# unit: count throughout; approved unweighted percentages are generated by
# the narrative layer for single-response measures in broad views only,
# always with count and base (Revision Brief section 12).
#
# Suppression policy v2 (agreed 2026-07-20): the rule of five applies to the
# SELECTED VIEW only (phase/year x gender x selected group). Within a
# reportable view, exact counts are shown even below five, including small
# question-specific bases. Exception: the ethnicity categories selected by
# fewer than five respondents school-wide are pre-aggregated (see
# load_normalise.ETHNICITY_MAP).
# ---------------------------------------------------------------------------

metrics:

  # ------------------------------------------------------------- profile ---
  responses_by_year:
    section: profile
    label: "How many pupil responses came from each year group?"
    question: 26871554
    type: single_choice
    field: year_key
    base_rule: accepted
    chart: vertical_bar
    cross_filter: year
    exempt: scope
    options: [y3, y4, y5, y6, y7, y8, y9, y10, y11]

  responses_by_gender:
    section: profile
    label: "How many pupils responded?"
    question: 26871497
    type: single_choice
    field: gender
    base_rule: accepted
    chart: vertical_bar
    cross_filter: gender
    exempt: gender
    options: [boy, girl, nonbinary, not_stated]
    base_note: >
      Every response option is shown, including options selected by no
      pupils, so the bars sum exactly to the base.

  # ------------------------------------------------------- active nation ---
  dl_combined:
    section: everyone
    label: "Pupils with a disability and/or learning difficulty"
    question: "Derived: answered Yes to the disability question or the learning difficulty question"
    type: single_choice
    field: dl_any
    base_rule: accepted
    chart: table_only
    cross_filter: cohort
    cohort_codes: ["yes"]
    options: ["yes", "no"]

  ed_combined:
    section: active_nation
    label: "Ethnically diverse background (combined filter group)"
    question: "Derived from 26871498/26871499: any ethnic group other than White, plus positively identified White minority backgrounds (Irish, Gypsy or Irish Traveller, Roma, any other White background)"
    type: single_choice
    field: ed_any
    base_rule: accepted
    chart: table_only
    cross_filter: cohort
    cohort_codes: ["yes"]
    options: ["yes", "no"]

  ws_combined:
    section: active_nation
    label: "Speaks Welsh (combined filter group)"
    question: "Derived from 26871567: speaks Welsh very well, a fair amount or a little"
    type: single_choice
    field: wl_any
    base_rule: accepted
    chart: table_only
    cross_filter: cohort
    cohort_codes: ["yes"]
    options: ["yes", "no"]

  freq_estimate:
    section: active_nation
    label: "On average, how often are our pupils engaging in sport each week?"
    question: "Derived: flat square-root estimate (total weekly occasions across all weekly sports, divided by the square root of the number of weekly sports)"
    type: single_choice
    field: freq_estimate
    base_rule: accepted
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [none_reported, e1, e2, e3, e4, e5, e6, e7, e8, e9plus]
    options: [none_reported, dont_know_only, less_weekly_only,
              e1, e2, e3, e4, e5, e6, e7, e8, e9plus]
    headline_pct: true
      columns so every pupil appears exactly once.


  club_freq_estimate:
    section: active_nation
    label: "On average, how often are our pupils engaging in sport each week in club settings?"
    question: "Derived: identical flat square-root estimate, restricted to school clubs and clubs outside school"
    type: single_choice
    field: club_freq_estimate
    base_rule: accepted
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [none_reported, e1, e2, e3, e4, e5, e6, e7, e8, e9plus]
    options: [none_reported, dont_know_only, less_weekly_only,
              e1, e2, e3, e4, e5, e6, e7, e8, e9plus]
    headline_pct: true
      appears exactly once.

  participation_settings:
    section: active_nation
    label: "Where are our pupils taking part in Sport?"
    question: "26871517-26871526 (settings matrix)"
    type: multi_select
    field: settings
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

  sports_participated:
    section: active_nation
    label: "Which sports and activities have our pupils done this school year?"
    question: "26871507-26871516 (ten category questions)"
    type: multi_select
    field: sports
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: cohort
    cohort_codes: all
    options: discover_participated

  school_club_freq:
    section: active_nation
    label: "How often are our pupils active through sport during School Sports Clubs at our school?"
    question: "26871591-26871600 (frequency matrix, derived)"
    type: single_choice
    field: acc_school_club_cat
    base_rule: routed
    chart: vertical_bar
    cross_filter: none
    options: [less_weekly_only, w1, w2, w3, w4, w5, w6, w7]

  community_club_freq:
    section: active_nation
    label: "How often are our pupils active through sport in a Club Outside of School each week?"
    question: "26871541-26871550 (frequency matrix, derived)"
    type: single_choice
    field: acc_community_club_cat
    base_rule: routed
    chart: vertical_bar
    cross_filter: none
    options: [less_weekly_only, w1, w2, w3, w4, w5, w6, w7]

  other_setting_freq:
    section: active_nation
    label: "How often are our pupils active through sport Somewhere Else?"
    question: "26871568-26871577 (frequency matrix, derived)"
    type: single_choice
    field: acc_somewhere_else_cat
    base_rule: routed
    chart: vertical_bar
    cross_filter: none
    options: [less_weekly_only, w1, w2, w3, w4, w5, w6, w7]

  sports_school_club:
    section: active_nation
    label: "Which sports do pupils say they do in a School Sports Club at our school?"
    question: "26871517-26871526 (settings matrix rows)"
    type: multi_select
    field: school_club_sports
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: none
    options: discover_participated

  sports_community_club:
    section: active_nation
    label: "Which sports do pupils say they do in a Club Outside of School?"
    question: "26871517-26871526 (settings matrix rows)"
    type: multi_select
    field: community_club_sports
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: none
    options: discover_participated

  sports_other_setting:
    section: active_nation
    label: "Which sports do pupils say they do Somewhere Else?"
    question: "26871517-26871526 (settings matrix rows)"
    type: multi_select
    field: other_setting_sports
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: none
    options: discover_participated

  sports_pe:
    section: full_results
    label: "Which sports do pupils say they do in PE or Lesson Time in our school?"
    question: "26871517-26871526 (settings matrix rows)"
    type: multi_select
    field: pe_sports
    base_rule: answered
    top_n: 10
    chart: horizontal_ranked_bar
    cross_filter: none
    options: discover_participated

  pe_freq:
    section: full_results
    label: "How often are our pupils active through sport during PE or Lesson Time each week?"
    question: "26871531-26871540 (frequency matrix, derived)"
    type: single_choice
    field: acc_pe_lessons_cat
    base_rule: routed
    chart: table_only
    cross_filter: none
    options: [less_weekly_only, w1, w2, w3, w4, w5, w6, w7]

  # ------------------------------------------------------------ everyone ---
  join_in_easily:
    section: everyone
    label: "Do you feel you can join in with sports and games easily?"
    question: 26871565
    type: single_choice
    field: join_in
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [always, sometimes, not_often, never]
    options: [always, sometimes, not_often, never]

  disability_condition:
    section: everyone
    label: "How many of our pupils have a disability or long-term condition?"
    question: 26871504
    type: single_choice
    field: disability
    base_rule: answered
    chart: horizontal_bar
    cross_filter: cohort
    cohort_codes: ["yes", "no", not_sure, prefer_not_to_say]
    options: ["yes", "no", not_sure, prefer_not_to_say]

  learning_difficulty:
    section: everyone
    label: "How many of our pupils have a learning difficulty?"
    question: 26871505
    type: single_choice
    field: learning
    base_rule: answered
    chart: horizontal_bar
    cross_filter: cohort
    cohort_codes: ["yes"]
    options: ["yes", "no", not_sure, prefer_not_to_say]

  take_part_method:
    section: everyone
    label: "How do our pupils usually take part in sport?"
    question: 26871506
    type: single_choice
    field: take_part
    base_rule: routed
    chart: horizontal_bar
    cross_filter: cohort
    cohort_codes: [standing, seated, communication_aids, not_sure, prefer_not_to_say, other]
    options: [standing, seated, communication_aids, not_sure, prefer_not_to_say, other]
    base_note: >
      Asked only of respondents who answered Yes, Not sure or Prefer not to
      say to the disability or long-term condition question.

  welsh_speaking:
    section: everyone
    label: "Do you speak Welsh?"
    question: 26871567
    type: single_choice
    field: welsh
    base_rule: answered
    chart: horizontal_bar
    cross_filter: cohort
    cohort_codes: [very_well, fair_amount, a_little, few_words, none]
    options: [very_well, fair_amount, a_little, few_words, none]

  welsh_when_playing_sport:
    section: everyone
    label: "Do you usually speak Welsh when you play sports?"
    question: 26871590
    type: single_choice
    field: welsh_sport
    base_rule: routed
    chart: horizontal_bar
    cross_filter: none
    options: ["yes", "no"]
    base_note: "Asked only of respondents who speak at least a few words of Welsh."

  ethnicity_group:
    section: everyone
    label: "What is the ethnicity of your pupils who took part?"
    question: "26871498 (top-level groups)"
    type: single_choice
    field: ethnicity
    base_rule: answered
    chart: horizontal_bar
    cross_filter: cohort
    cohort_codes: [white, mixed, asian, other_grouped, not_sure, prefer_not_to_say]
    options: [white, mixed, asian, other_grouped, not_sure, prefer_not_to_say]
    base_note: >
      Categories selected by fewer than five respondents across the whole
      school are combined into "Other ethnic groups" to protect individual
      pupils.

  # ------------------------------------------------------------ lifelong ---
  pe_feel_healthy:
    section: lifelong
    label: "Do PE and Active Lessons make you feel healthy?"
    question: "26871587 (row: Healthy?)"
    type: single_choice
    field: pe_feel.healthy
    base_rule: answered
    chart: vertical_bar
    cross_filter: none
    options: [very, quite, not_very, not_at_all]

  pe_feel_confident:
    section: lifelong
    label: "Do PE and Active Lessons make you feel confident?"
    question: "26871587 (row: Confident?)"
    type: single_choice
    field: pe_feel.confident
    base_rule: answered
    chart: vertical_bar
    cross_filter: none
    options: [very, quite, not_very, not_at_all]

  pe_feel_ready:
    section: lifelong
    label: "Do PE and Active Lessons make you feel ready to learn?"
    question: "26871587 (row: Ready to learn?)"
    type: single_choice
    field: pe_feel.ready_to_learn
    base_rule: answered
    chart: vertical_bar
    cross_filter: none
    options: [very, quite, not_very, not_at_all]

  most_important:
    section: lifelong
    label: "What is most important to you when you play sport?"
    question: 26871589
    type: multi_select
    field: important
    base_rule: answered
    chart: horizontal_ranked_bar
    cross_filter: cohort
    cohort_codes: [having_fun, friends, improving_skills, feeling_confident]
    options: [having_fun, friends, improving_skills, feeling_confident, winning,
              coach_or_teacher, feeling_safe, equipment_facilities, other, none_of_these]
    tail_options: [other, none_of_these]

  would_do_more_if:
    section: lifelong
    label: "What would help our pupils do more sport?"
    question: 26871588
    type: multi_select
    field: more_if
    base_rule: answered
    chart: horizontal_ranked_bar
    cross_filter: cohort
    cohort_codes: [more_sports_liked, more_confident, easier_to_take_part,
                   more_motivated, more_comfortable, equipment_or_cost, other]
    options: [more_sports_liked, more_confident, easier_to_take_part, more_motivated,
              more_comfortable, equipment_or_cost, other, none_of_these]
    tail_options: [other, none_of_these]

  sports_wanted:
    section: lifelong
    label: "Which sports would our pupils like to do more of?"
    question: 26871551
    type: multi_select
    field: demand
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: cohort
    cohort_codes: all
    options: discover_demand

  unmet_demand:
    section: lifelong
    label: "Which sports would our pupils like to do more of but are not currently doing?"
    question: "Derived from 26871551 and 26871507-26871516"
    type: multi_select
    field: unmet
    base_rule: answered
    chart: horizontal_ranked_bar
    top_n: 10
    cross_filter: none
    options: discover_demand
    base_note: >
      Unmet demand: the respondent selected the sport as one they would like
      to do more of, and did not report currently doing it this school year.

  # ----------------------------------------------------------- enjoyment ---
  enjoy_pe:
    section: enjoyment
    label: "How much do our pupils enjoy sport in PE lessons?"
    question: "26871552 (row: PE lessons)"
    type: single_choice
    field: enjoy.pe_lessons
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [a_lot, a_little, not_much, not_at_all, not_sure]
    options: [a_lot, a_little, not_much, not_at_all, not_sure]

  enjoy_school_clubs:
    section: enjoyment
    label: "How much do our pupils enjoy sport in school sports clubs?"
    question: "26871552 (row: School sports clubs)"
    type: single_choice
    field: enjoy.school_clubs
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [a_lot, a_little, not_much, not_at_all, not_sure]

  enjoy_community_clubs:
    section: enjoyment
    label: "How much do our pupils enjoy sport in clubs outside of school?"
    question: "26871552 (row: Sports clubs outside of school)"
    type: single_choice
    field: enjoy.community_clubs
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [a_lot, a_little, not_much, not_at_all, not_sure]

  enjoy_other_settings:
    section: enjoyment
    label: "How much do our pupils enjoy sport in other settings, like the park or garden?"
    question: "26871552 (row: Other settings)"
    type: single_choice
    field: enjoy.other_settings
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [a_lot, a_little, not_much, not_at_all, not_sure]

  ideas_listened:
    section: enjoyment
    label: "Do you feel your ideas about sport are listened to by teachers?"
    question: 26871566
    type: single_choice
    field: listened
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [always, sometimes, not_often, never]
    options: [always, sometimes, not_often, never]

  confidence_try_new:
    section: enjoyment
    label: "How confident are you to try a new sport?"
    question: "26871586 (row: Try a new sport?)"
    type: single_choice
    field: confidence.try_new
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [very, quite, not_very, not_at_all]
    options: [very, quite, not_very, not_at_all]

  confidence_learn_skill:
    section: enjoyment
    label: "How confident are you to learn a new skill?"
    question: "26871586 (row: Learn a new skill?)"
    type: single_choice
    field: confidence.learn_skill
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [very, quite, not_very, not_at_all]

  confidence_try_again:
    section: enjoyment
    label: "How confident are you to try again when sport is hard?"
    question: "26871586 (row: Try again when sport is hard?)"
    type: single_choice
    field: confidence.try_again
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [very, quite, not_very, not_at_all]

  confidence_new_place:
    section: enjoyment
    label: "How confident are you to try sport in a new place?"
    question: "26871586 (row: Try sport in a new place?)"
    type: single_choice
    field: confidence.new_place
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: all
    options: [very, quite, not_very, not_at_all]

# ---------------------------------------------------------------------------
# Chart-derived selected groups (reader-facing term: "selected group").
# One active selected group maximum; a new selection replaces the previous.
# Prototype 3 additions: barriers, latent demand, feeling listened to and
# what-matters (Revision Brief section 20).
# ---------------------------------------------------------------------------
  settings_dl:
    section: everyone
    label: "Where are our pupils with a disability and/or learning difficulty active through sport?"
    question: "Derived: participation settings among pupils who answered Yes to the disability or learning difficulty question"
    type: multi_select
    field: settings_dl
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

  settings_dy:
    section: everyone
    label: "Pupils with a disability or long-term condition"
    question: "Derived: participation settings among pupils who answered Yes to the disability question"
    type: multi_select
    field: settings_dy
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

  settings_ly:
    section: everyone
    label: "Pupils with a learning difficulty"
    question: "Derived: participation settings among pupils who answered Yes to the learning difficulty question"
    type: multi_select
    field: settings_ly
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

  settings_ed:
    section: everyone
    label: "Where are our pupils from ethnically diverse backgrounds active through sport?"
    question: "Derived: participation settings among pupils who selected any ethnic group other than White"
    type: multi_select
    field: settings_ed
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

  settings_wl:
    section: everyone
    label: "Where are our pupils who speak Welsh active through sport?"
    question: "Derived: participation settings among pupils who speak Welsh very well or a fair amount"
    type: multi_select
    field: settings_wl
    base_rule: answered
    chart: vertical_bar
    cross_filter: cohort
    cohort_codes: [pe_lessons, school_club, community_club, somewhere_else]
    options: [pe_lessons, school_club, community_club, somewhere_else]

