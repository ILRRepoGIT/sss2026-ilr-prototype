# ---------------------------------------------------------------------------
# Stable base colour per metric (Revision Brief section 6.1). The colour is
# intentional, stored here as metric metadata, and identical in every filter
# state and in the appendices. Yellow is reserved for the selected value.
# ---------------------------------------------------------------------------
base_colours:
  overall_freq: blue
  freq_estimate: blue
  responses_by_year: blue
  responses_by_gender: blue
  organised_freq: blue
  participation_settings: red
  sports_participated: blue
  school_club_freq: blue
  sports_school_club: blue
  community_club_freq: red
  sports_community_club: red
  other_setting_freq: blue
  sports_other_setting: blue
  sports_pe: blue
  pe_freq: blue
  join_in_easily: red
  disability_condition: red
  learning_difficulty: blue
  take_part_method: red
  welsh_speaking: blue
  welsh_when_playing_sport: blue
  ethnicity_group: red
  pe_feel_healthy: blue
  pe_feel_confident: blue
  pe_feel_ready: blue
  most_important: blue
  would_do_more_if: red
  sports_wanted: blue
  unmet_demand: red
  enjoy_pe: red
  enjoy_school_clubs: red
  enjoy_community_clubs: red
  enjoy_other_settings: red
  ideas_listened: blue
  confidence_try_new: red
  confidence_learn_skill: red
  confidence_try_again: red
  confidence_new_place: red

# Source-selection replacements (section 15 / 17.1): when a chart answer
# defines the selected group, headline content switches to the stated
# alternative instead of restating the defining answer.
source_replacements:
  sports_participated: exclude_selected_option
  sports_wanted: exclude_selected_option
  would_do_more_if: exclude_selected_option
  most_important: exclude_selected_option
  enjoy_pe: { card: enjoy_school_clubs }
  confidence_try_new: { card: confidence_learn_skill }
  ideas_listened: { card: join_in_always }
  join_in_easily: { card: ideas_listened_pos }
# EOF sentinel
