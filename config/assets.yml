# Asset manifest - School Sport Survey 2026 ILR prototype (V4.16)
# All images are embedded at build time as optimised WebP (alpha preserved)
# through pipeline/yac_assets.py, which is the single table of files, tokens
# and alt-frame keys; this manifest documents the placements. The Corrective
# Brief section 5 withholding of the Young Artist artwork was lifted by the
# owner's instruction of 22 Sep 2026 ("Finals YCA" pack, fourteen entries):
# each entry is placed ONCE, with an alt frame on Framework sheet 43
# (ui.alt_yac_*, English; Welsh pending the translator). No pupil's name
# appears in any alt text. "credit" and publication approval to be confirmed
# with Sport Wales before production use (Framework sheet 65).

